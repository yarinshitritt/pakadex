<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css?v=1">
  <title>PAKADEX - טבלאות אקסל</title>
  <style>
    .excel-note {
      background: #f0f9ff; border: 1px solid #bae6fd; color: #075985;
      border-radius: 6px; padding: 8px 12px; font-size: 13px; font-weight: 600; margin-bottom: 8px;
    }
    .excel-weekbar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: var(--radius-md); padding: 10px 14px; margin-bottom: 8px; box-shadow: var(--shadow-sm);
    }
    .excel-navbtn {
      height: 38px; padding: 0 14px; border: 1px solid var(--border-color); border-radius: 6px;
      background: #1e293b; color: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
    }
    .excel-navbtn:hover { background: #334155; }
    .week-btn {
      height: 40px; min-width: 140px; padding: 0 16px; border: 2px solid var(--primary);
      border-radius: 8px; background: var(--primary); color: #fff; font-weight: 800; font-size: 14px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1;
    }
    .week-btn small { font-weight: 600; font-size: 11px; color: #d1fae5; }
    .week-btn .dot { color: #d1fae5; font-size: 11px; }

    .excel-link-card {
      background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm); padding: 24px; min-height: 260px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center;
    }
    .excel-link-card .big { font-size: 46px; }
    .excel-link-card .title { font-weight: 800; font-size: 18px; color: #64748b; }
    .excel-link-card .subtitle { color: #94a3b8; font-size: 13px; }
    .excel-open-btn {
      height: 42px; padding: 0 22px; border: none; border-radius: 8px;
      background: linear-gradient(135deg,#0284c7,#0369a1); color: #fff; font-weight: 800; font-size: 15px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
    }
    .excel-open-btn:hover { transform: translateY(-1px); }
    .excel-manage-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .excel-manage-btn {
      height: 34px; padding: 0 14px; border: 1px solid var(--border-color); border-radius: 6px;
      background: #f1f5f9; color: #334155; font-weight: 700; font-size: 13px; cursor: pointer;
    }
    .excel-manage-btn.danger { background: #fee2e2; color: #dc2626; border-color: #fca5a5; }
    .excel-link-form {
      display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 440px; text-align: right;
    }
    .excel-link-form label { font-weight: 700; font-size: 13px; color: #334155; }
    .excel-link-form input {
      height: 40px; padding: 0 10px; font-family: inherit; font-size: 14px;
      border: 1px solid var(--border-color); border-radius: 6px; outline: none; background: #fff; color: #0f172a; width: 100%; box-sizing: border-box;
    }
    .excel-link-form input:focus { border-color: var(--primary); }
    .excel-link-form-actions { display: flex; gap: 8px; }
  </style>
</head>
<body>

  <div id="top-nav-placeholder"></div>

  <div style="display:flex; gap:12px; align-items:flex-start; margin-top: 8px; width: 100%;">

    <div id="side-nav-placeholder"></div>

    <div style="flex:1; display:flex; flex-direction:column; min-width:0;">

      <div class="excel-note">
        📅 טבלאות אקסל מקובצות בשלשות שבועות. עבור כל טווח כזה ניתן לקשר קובץ אקסל חיצוני (למשל מ-SharePoint) - הקישור נפתח בלחיצה בתוכנת האקסל/בדפדפן. הניווט מדלג טווח שלם (3 שבועות) בכל פעם. הוספה/מחיקה של קישור זמינה למנהלי מערכת בלבד.
      </div>

      <div class="excel-weekbar">
        <button class="excel-navbtn" onclick="shiftWeeks(3)" title="3 שבועות קדימה">הבא ▶</button>
        <div id="weekButtons" style="display:flex; gap:8px;"></div>
        <button class="excel-navbtn" onclick="shiftWeeks(-3)" title="3 שבועות אחורה">◀ הקודם</button>
      </div>

      <div id="excelLinkCard" class="excel-link-card"></div>

    </div>
  </div>

  <script src="config.js?v=1"></script>
  <script src="sharepointService.js?v=1"></script>
  <script src="auth.js?v=1"></script>
  <script src="script.js?v=1"></script>

  <script>
    const GROUP_SIZE = 3;
    let baseWeek, curYear;
    let editingLink = false;

    // מפתח שמירה לפי טווח שבועות (קבוצה של 3), לא לפי שבוע בודד
    function groupEndWeek(start) { return Math.min(start + GROUP_SIZE - 1, 52); }
    function excelKey(startWeek, year) { return `pakadex_excel_group${startWeek}_year${year}`; }

    function canManageExcelLinks() {
      return typeof AUTH !== 'undefined' && AUTH.getSession() && AUTH.canEditPage('general.html');
    }

    async function initWeeks() {
      const wy = (typeof getCurrentWeekAndYear === 'function') ? getCurrentWeekAndYear() : { week: 1, year: new Date().getFullYear() };
      baseWeek = wy.week;
      curYear = wy.year;
      await refreshView();
    }

    async function shiftWeeks(delta) {
      baseWeek += delta;
      if (baseWeek < 1) baseWeek = 1;
      if (baseWeek > 52) baseWeek = 52;
      editingLink = false;
      await refreshView();
    }

    async function getStoredLink() {
      const key = excelKey(baseWeek, curYear);
      if (typeof DataService !== 'undefined') {
        return await DataService.getItem(key);
      }
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    }

    async function refreshView() {
      const stored = await getStoredLink();
      renderWeekButtons(!!stored);
      renderLinkCard(stored);
    }

    function renderWeekButtons(hasLink) {
      const cont = document.getElementById('weekButtons');
      const end = groupEndWeek(baseWeek);
      const rangeLabel = end > baseWeek ? `שבוע ${baseWeek}-${end}` : `שבוע ${baseWeek}`;
      cont.innerHTML = `<div class="week-btn">${rangeLabel} ${hasLink ? '<span class="dot">●</span>' : ''}<small>${curYear}</small></div>`;
    }

    function renderLinkCard(stored) {
      const card = document.getElementById('excelLinkCard');
      const canManage = canManageExcelLinks();
      const end = groupEndWeek(baseWeek);
      const rangeText = end > baseWeek ? `שבועות ${baseWeek}-${end}` : `שבוע ${baseWeek}`;

      if (editingLink && canManage) {
        card.innerHTML = `
          <div class="excel-link-form">
            <div>
              <label for="excelLinkLabel">שם הקובץ (לתצוגה)</label>
              <input type="text" id="excelLinkLabel" placeholder="לדוגמה: לו"ז אקסל ${rangeText}" value="${stored && stored.label ? stored.label.replace(/"/g,'&quot;') : ''}">
            </div>
            <div>
              <label for="excelLinkUrl">קישור לקובץ (SharePoint / רשת)</label>
              <input type="text" id="excelLinkUrl" placeholder="https://..." value="${stored && stored.url ? stored.url.replace(/"/g,'&quot;') : ''}">
            </div>
            <div class="excel-link-form-actions">
              <button class="excel-manage-btn" style="background:linear-gradient(135deg,#16a34a,#15803d); color:#fff; border:none;" onclick="saveLink()">💾 שמור קישור</button>
              <button class="excel-manage-btn" onclick="cancelEditLink()">ביטול</button>
            </div>
          </div>`;
        return;
      }

      if (!stored) {
        card.innerHTML = `
          <div class="big">📊</div>
          <div class="title">אין קובץ מקושר ל${rangeText}</div>
          ${canManage
            ? `<div class="subtitle">הוסף קישור לקובץ אקסל חיצוני עבור טווח שבועות זה.</div>
               <div class="excel-manage-row"><button class="excel-manage-btn" onclick="startEditLink()">➕ הוסף קישור</button></div>`
            : `<div class="subtitle">המנהל טרם קישר קובץ לטווח שבועות זה.</div>`}
        `;
        return;
      }

      card.innerHTML = `
        <div class="big">📗</div>
        <div class="title">${stored.label ? stored.label : 'קובץ אקסל ל' + rangeText}</div>
        <a class="excel-open-btn" href="${stored.url}" target="_blank" rel="noopener noreferrer">🔗 פתח קובץ</a>
        ${canManage ? `
          <div class="excel-manage-row">
            <button class="excel-manage-btn" onclick="startEditLink()">✏️ ערוך קישור</button>
            <button class="excel-manage-btn danger" onclick="deleteLink()">🗑️ מחק</button>
          </div>` : ''}
      `;
    }

    function startEditLink() {
      if (!canManageExcelLinks()) return;
      editingLink = true;
      refreshView();
    }

    function cancelEditLink() {
      editingLink = false;
      refreshView();
    }

    async function saveLink() {
      if (!canManageExcelLinks()) return;
      const url = document.getElementById('excelLinkUrl').value.trim();
      const label = document.getElementById('excelLinkLabel').value.trim();
      if (!url) { alert('יש להזין קישור לקובץ.'); return; }
      const key = excelKey(baseWeek, curYear);
      const data = { url, label, updatedAt: Date.now() };
      if (typeof DataService !== 'undefined') { await DataService.setItem(key, data); }
      else { localStorage.setItem(key, JSON.stringify(data)); }
      editingLink = false;
      await refreshView();
    }

    async function deleteLink() {
      if (!canManageExcelLinks()) return;
      const end = groupEndWeek(baseWeek);
      const rangeText = end > baseWeek ? `שבועות ${baseWeek}-${end}` : `שבוע ${baseWeek}`;
      if (!confirm(`למחוק את הקישור לקובץ האקסל של ${rangeText}?`)) return;
      const key = excelKey(baseWeek, curYear);
      if (typeof DataService !== 'undefined') { await DataService.setItem(key, null); }
      else { localStorage.removeItem(key); }
      await refreshView();
    }

    // אתחול לאחר שסקריפט הליבה הגדיר את השבוע/שנה
    window.addEventListener('load', initWeeks);
  </script>
</body>
</html>
