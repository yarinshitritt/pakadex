<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <title>PAKADEX - ראשי</title>
  <style>
    .welcome-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 60vh;
      text-align: center;
      background: white;
      border: 2px solid #0aa1b2;
      border-radius: 12px;
      margin-top: 20px;
      padding: 40px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }
    .welcome-container h1 { font-size: 80px; margin-bottom: 10px; text-shadow: 2px 2px 5px rgba(0,0,0,0.2); }
    .welcome-container p { font-size: 24px; color: #333; font-weight: bold; }
  </style>
</head>
<body>

  <div id="top-nav-placeholder"></div>

  <div style="display:flex; gap:20px; align-items:flex-start; margin-top: 10px; width: 100%;">
    <div id="side-nav-placeholder"></div>
    
    <div class="table-container" style="margin-top: 0; display:flex; justify-content:center; align-items:center;">
      <div class="welcome-container">
        <h1>PAKADEX</h1>
        <p>ברוכים הבאים למערכת ניהול הציוד והאימונים של בהל"ג.</p>
        <p style="color: #0aa1b2; font-size:18px;">אנא בחרו יחידה או טבלה מהתפריט בצד כדי להתחיל.</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
