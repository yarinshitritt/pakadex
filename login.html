<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css?v=25">
  <title>PAKADEX - כניסה למערכת</title>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 92vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      margin: 0;
    }
    .login-card {
      width: 380px;
      max-width: 92vw;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35);
      padding: 34px 30px 28px;
      text-align: center;
    }
    .login-logo {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 36px;
      color: #0f172a;
      letter-spacing: 1px;
    }
    .login-sub { color: var(--text-muted); font-weight: 600; margin: 2px 0 24px; font-size: 14px; }
    .login-label { display: block; text-align: right; font-weight: 700; margin-bottom: 6px; color: #0f172a; font-size: 14px; }
    .login-input {
      width: 100%;
      height: 52px;
      font-size: 24px;
      font-weight: 800;
      text-align: center;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      outline: none;
      letter-spacing: 3px;
      font-family: inherit;
      transition: border-color 0.15s;
    }
    .login-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(2,132,199,0.15); }
    .login-btn {
      width: 100%;
      height: 48px;
      margin-top: 16px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }
    .login-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(2,132,199,0.35); }
    .login-error {
      color: #b91c1c;
      background: #fee2e2;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13.5px;
      margin-top: 14px;
      padding: 9px 12px;
      display: none;
    }
    .login-hint {
      color: #92400e;
      background: #fef3c7;
      border: 1px solid #fcd34d;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 700;
      margin-top: 16px;
      padding: 9px 12px;
      display: none;
    }
    .card-note { color: #94a3b8; font-size: 12px; margin-top: 18px; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">PAKADEX</div>
    <div class="login-sub">מערכת ניהול משאבים ותיאומים</div>

    <label class="login-label" for="pnInput">מספר אישי</label>
    <input type="text" id="pnInput" class="login-input" inputmode="numeric" autocomplete="off"
           placeholder="הזן מספר אישי" autofocus>

    <button class="login-btn" id="loginBtn">כניסה למערכת ➔</button>

    <div id="loginError" class="login-error"></div>
    <div id="loginHint" class="login-hint"></div>

    <div class="card-note">💳 ניתן להעביר כרטיס חוגר בקורא — הקריאה תתבצע אוטומטית</div>
  </div>

  <script src="config.js?v=25"></script>
  <script src="sharepointService.js?v=25"></script>
  <script src="auth.js?v=25"></script>
  <script>
    // אם כבר קיים סשן פעיל - מעבר ישיר למערכת
    if (AUTH.getSession()) window.location.replace('index.html');

    const pnInput = document.getElementById('pnInput');
    const errEl = document.getElementById('loginError');
    const hintEl = document.getElementById('loginHint');

    function showError(msg) {
      errEl.textContent = msg;
      errEl.style.display = 'block';
      pnInput.select();
    }

    function refreshHint() {
      if (AUTH.loadUsers().length === 0) {
        hintEl.textContent = 'התחברות ראשונה: המספר האישי הראשון שיוזן יוגדר אוטומטית כמנהל המערכת.';
        hintEl.style.display = 'block';
      } else {
        hintEl.style.display = 'none';
      }
    }

    function doLogin() {
      errEl.style.display = 'none';
      const res = AUTH.login(pnInput.value);
      if (res.ok) {
        window.location.href = 'index.html';
      } else {
        showError(res.error || 'שגיאת התחברות.');
      }
    }

    document.getElementById('loginBtn').addEventListener('click', doLogin);

    // קורא הכרטיסים מדמה מקלדת ומסיים ב-Enter
    pnInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); doLogin(); }
    });

    // ניקוי תווים שאינם ספרות (קורא הכרטיסים עלול לשלוח תווי בקרה)
    pnInput.addEventListener('input', () => {
      const clean = pnInput.value.replace(/\D/g, '');
      if (clean !== pnInput.value) pnInput.value = clean;
    });

    // שמירה על הפוקוס בשדה כדי שקריאת כרטיס תיקלט תמיד
    document.addEventListener('click', () => pnInput.focus());

    /**
     * ניסיון זיהוי אוטומטי דרך זהות ה-Windows/AD המאומתת (מפל"ז + SharePoint).
     * במקרה כשל (לא מוגדר / לא נמצא / שגיאת רשת) - נופל בחזרה בשקט למסך ההזנה הידנית/קורא הכרטיסים,
     * מבלי להציג שגיאה למשתמש (זו לא "טעות כניסה" אלא פשוט מעבר לזרימה הרגילה).
     */
    async function tryAutoLogin() {
      if (typeof AUTH.tryAutoLoginFromSharePoint !== 'function') return false;
      pnInput.disabled = true;
      pnInput.placeholder = 'מזהה משתמש...';
      const res = await AUTH.tryAutoLoginFromSharePoint();
      if (res.ok) {
        window.location.href = 'index.html';
        return true;
      }
      pnInput.disabled = false;
      pnInput.placeholder = 'הזן מספר אישי';
      pnInput.focus();
      return false;
    }

    // רענון רשימת המשתמשים מהשרת (אם מוגדר), ניסיון זיהוי אוטומטי, ואז עדכון ההנחיה
    (async () => {
      try { if (typeof DataService !== 'undefined') await AUTH.refreshUsers(); } catch (e) {}
      const autoLoggedIn = await tryAutoLogin();
      if (!autoLoggedIn) refreshHint();
    })();
    refreshHint();
  </script>
</body>
</html>
