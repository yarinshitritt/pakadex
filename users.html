<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css?v=35">
  <title>PAKADEX - ניהול הרשאות</title>
  <style>
    .users-wrap { width: 100%; }
    .users-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      padding: 16px;
      margin-bottom: 12px;
    }
    .users-card h2 { margin: 0 0 14px; font-size: 18px; color: #0f172a; }
    .user-form { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-weight: 700; font-size: 13px; color: #334155; }
    .field input, .field select {
      height: 40px; padding: 0 10px; font-family: inherit; font-size: 14px;
      border: 1px solid var(--border-color); border-radius: 6px; outline: none; background: #fff; color: #0f172a;
    }
    .field input:focus, .field select:focus { border-color: var(--primary); }
    #pnField { width: 150px; font-weight: 800; letter-spacing: 1px; text-align: center; }
    #nameField { width: 190px; }
    .save-user-btn {
      height: 40px; padding: 0 20px; border: none; border-radius: 6px;
      background: linear-gradient(135deg,#16a34a,#15803d); color: #fff;
      font-weight: 800; font-size: 14px; font-family: inherit; cursor: pointer;
    }
    .save-user-btn:hover { transform: translateY(-1px); }
    .clear-btn {
      height: 40px; padding: 0 14px; border: 1px solid var(--border-color);
      border-radius: 6px; background: #f1f5f9; color: #334155; font-weight: 700; cursor: pointer; font-family: inherit;
    }
    table.users-table { width: 100%; border-collapse: collapse; }
    table.users-table th {
      background: #0f172a; color: #fff; padding: 9px 10px; font-size: 13.5px; text-align: right; border: 1px solid #1e293b;
    }
    table.users-table td { padding: 8px 10px; border: 1px solid var(--border-color); font-size: 13.5px; text-align: right; }
    table.users-table tr:hover td { background: #f8fafc; }
    .role-chip { padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 800; white-space: nowrap; }
    .role-admin    { background: #ede9fe; color: #5b21b6; border: 1px solid #c4b5fd; }
    .role-editor   { background: #dbeafe; color: #1e40af; border: 1px solid #93c5fd; }
    .role-readonly { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
    .role-unit     { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .row-btn { border: none; border-radius: 6px; padding: 5px 12px; font-weight: 700; font-size: 12.5px; cursor: pointer; font-family: inherit; margin-left: 5px; }
    .edit-btn { background: #e0f2fe; color: #0369a1; border: 1px solid #7dd3fc; }
    .del-btn  { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; }
    .msg { border-radius: 8px; padding: 9px 12px; font-weight: 700; font-size: 13.5px; margin-bottom: 10px; display: none; }
    .msg.ok  { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .msg.err { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
    .empty-row { text-align: center; color: #94a3b8; font-weight: 600; padding: 20px; }
    .unit-dropdown { position: relative; width: 200px; }
    .unit-dropdown-btn {
      width: 100%; height: 40px; padding: 0 10px; display: flex; align-items: center; justify-content: space-between;
      font-family: inherit; font-size: 13.5px; font-weight: 700; color: #0f172a;
      border: 1px solid var(--border-color); border-radius: 6px; background: #fff; cursor: pointer;
    }
    .unit-dropdown-btn:hover { border-color: var(--primary); }
    .unit-dropdown-arrow { color: #94a3b8; font-size: 11px; transition: transform 0.15s; }
    .unit-dropdown.open .unit-dropdown-arrow { transform: rotate(180deg); }
    .unit-dropdown-panel {
      display: none; position: absolute; top: calc(100% + 4px); right: 0; min-width: 200px; z-index: 50;
      background: #fff; border: 1px solid var(--border-color); border-radius: 8px; box-shadow: var(--shadow-md, 0 4px 10px rgba(0,0,0,0.12));
      padding: 6px; flex-direction: column; gap: 2px;
    }
    .unit-dropdown.open .unit-dropdown-panel { display: flex; }
    .unit-check-item {
      display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 6px;
      cursor: pointer; font-size: 13px; font-weight: 700; white-space: nowrap;
    }
    .unit-check-item:hover { background: #f1f5f9; }
    .unit-check-item input { cursor: pointer; }
    .unit-check-item.checked { background: #dcfce7; color: #166534; }
    .users-card-header {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 14px;
    }
    .users-card-header h2 { margin: 0; }
    .search-box { position: relative; }
    .search-box input {
      height: 38px; padding: 0 34px 0 12px; font-family: inherit; font-size: 14px;
      border: 1px solid var(--border-color); border-radius: 8px; outline: none; background: #fff; color: #0f172a;
      width: 240px;
    }
    .search-box input:focus { border-color: var(--primary); }
    .search-box .search-icon {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: #94a3b8; pointer-events: none; font-size: 14px;
    }
  </style>
</head>
<body>

  <div id="top-nav-placeholder"></div>

  <div style="display:flex; gap:12px; align-items:flex-start; margin-top: 8px; width: 100%;">
    <div id="side-nav-placeholder"></div>

    <div class="users-wrap" style="flex:1; min-width:0;">

      <div id="msgBox" class="msg"></div>

      <div class="users-card">
        <h2>➕ הוספת משתמש / עדכון הרשאה</h2>
        <div class="user-form">
          <div class="field">
            <label for="pnField">מספר אישי</label>
            <input type="text" id="pnField" inputmode="numeric" placeholder="הזן מספר אישי" autocomplete="off">
          </div>
          <div class="field">
            <label for="nameField">שם המשתמש</label>
            <input type="text" id="nameField" placeholder="שם מלא" autocomplete="off">
          </div>
          <div class="field">
            <label for="roleField">הרשאה</label>
            <select id="roleField" onchange="onRoleChange()">
              <option value="admin">מנהל</option>
              <option value="editor">צפייה ועריכה</option>
              <option value="readonly">צפייה בלבד</option>
              <option value="unit">פלוגתי / יחידתי</option>
            </select>
          </div>
          <div class="field" id="unitWrap" style="display:none;">
            <label>יחידות (ניתן לבחור כמה)</label>
            <div class="unit-dropdown" id="unitDropdown">
              <button type="button" class="unit-dropdown-btn" onclick="toggleUnitDropdown(event)">
                <span id="unitDropdownLabel">בחר יחידות...</span> <span class="unit-dropdown-arrow">▾</span>
              </button>
              <div id="unitField" class="unit-dropdown-panel">
                <label class="unit-check-item"><input type="checkbox" value="esuk" onchange="onUnitCheckChange(this)"> בא"ח איסו"ק</label>
                <label class="unit-check-item"><input type="checkbox" value="hirg" onchange="onUnitCheckChange(this)"> בא"ח חיר"ג</label>
                <label class="unit-check-item"><input type="checkbox" value="pikud" onchange="onUnitCheckChange(this)"> גדוד הפיקוד</label>
                <label class="unit-check-item"><input type="checkbox" value="tazam" onchange="onUnitCheckChange(this)"> ענף תצ"מ</label>
                <label class="unit-check-item"><input type="checkbox" value="bahalag" onchange="onUnitCheckChange(this)"> מפח"ט</label>
              </div>
            </div>
          </div>
          <button class="save-user-btn" onclick="submitUser()">שמור</button>
          <button class="clear-btn" onclick="clearForm()">נקה</button>
        </div>
      </div>

      <div class="users-card">
        <div class="users-card-header">
          <h2>👥 משתמשי המערכת</h2>
          <div class="search-box">
            <input type="text" id="searchPnField" inputmode="numeric" placeholder="חיפוש לפי מספר אישי..." autocomplete="off" oninput="renderUsers()">
            <span class="search-icon">🔍</span>
          </div>
        </div>
        <table class="users-table">
          <thead>
            <tr>
              <th style="width:130px;">מספר אישי</th>
              <th>שם</th>
              <th style="width:190px;">הרשאה</th>
              <th style="width:170px;">פעולות</th>
            </tr>
          </thead>
          <tbody id="usersBody"></tbody>
        </table>
      </div>

    </div>
  </div>

  <script src="config.js?v=35"></script>
  <script src="sharepointService.js?v=35"></script>
  <script src="auth.js?v=35"></script>
  <script src="script.js?v=35"></script>

  <script>
    // מסך זה פתוח למנהל בלבד
    let ACCESS_GRANTED = false;
    (function guard() {
      const s = AUTH.requireAuth();
      if (!s) return;
      if (AUTH.canManageUsers()) { ACCESS_GRANTED = true; return; }
      {
        document.body.innerHTML =
          '<div style="max-width:520px; margin:80px auto; background:#fff; border:1px solid #fca5a5; border-radius:12px; padding:28px; text-align:center; box-shadow:0 10px 25px rgba(0,0,0,0.1);">' +
          '<div style="font-size:44px;">🔒</div>' +
          '<h2 style="color:#b91c1c; margin:10px 0;">אין הרשאה לצפות במסך זה</h2>' +
          '<p style="color:#475569; font-weight:600;">מסך ניהול ההרשאות זמין למנהלי מערכת בלבד.</p>' +
          '<a href="index.html" style="display:inline-block; margin-top:12px; background:#0284c7; color:#fff; padding:10px 22px; border-radius:8px; font-weight:800; text-decoration:none;">חזרה למערכת</a>' +
          '</div>';
      }
    })();

    function showMsg(text, isError) {
      const box = document.getElementById('msgBox');
      box.textContent = text;
      box.className = 'msg ' + (isError ? 'err' : 'ok');
      box.style.display = 'block';
      setTimeout(() => { box.style.display = 'none'; }, 4000);
    }

    function onRoleChange() {
      const role = document.getElementById('roleField').value;
      document.getElementById('unitWrap').style.display = (role === 'unit') ? 'flex' : 'none';
    }

    const UNIT_SHORT_NAMES = { esuk: 'איסו"ק', hirg: 'חיר"ג', pikud: 'פיקוד', tazam: 'תצ"מ', bahalag: 'מפח"ט' };

    function toggleUnitDropdown(e) {
      e.stopPropagation();
      document.getElementById('unitDropdown').classList.toggle('open');
    }
    document.addEventListener('click', (e) => {
      const dd = document.getElementById('unitDropdown');
      if (dd && dd.classList.contains('open') && !dd.contains(e.target)) dd.classList.remove('open');
    });

    function updateUnitDropdownLabel() {
      const checked = getCheckedUnits();
      const label = document.getElementById('unitDropdownLabel');
      label.textContent = checked.length
        ? checked.map(u => UNIT_SHORT_NAMES[u] || u).join(', ')
        : 'בחר יחידות...';
    }

    function onUnitCheckChange(checkbox) {
      checkbox.closest('.unit-check-item').classList.toggle('checked', checkbox.checked);
      updateUnitDropdownLabel();
    }

    function getCheckedUnits() {
      return Array.from(document.querySelectorAll('#unitField input[type="checkbox"]:checked')).map(cb => cb.value);
    }

    function setCheckedUnits(units) {
      const list = Array.isArray(units) ? units : (units ? [units] : []);
      document.querySelectorAll('#unitField input[type="checkbox"]').forEach(cb => {
        cb.checked = list.includes(cb.value);
        cb.closest('.unit-check-item').classList.toggle('checked', cb.checked);
      });
      updateUnitDropdownLabel();
    }

    function clearForm() {
      document.getElementById('pnField').value = '';
      document.getElementById('nameField').value = '';
      document.getElementById('roleField').value = 'admin';
      setCheckedUnits([]);
      onRoleChange();
      document.getElementById('pnField').focus();
    }

    function submitUser() {
      const res = AUTH.saveUser({
        pn: document.getElementById('pnField').value,
        name: document.getElementById('nameField').value,
        role: document.getElementById('roleField').value,
        unit: getCheckedUnits()
      });

      if (!res.ok) { showMsg(res.error, true); return; }
      showMsg(`ההרשאה נשמרה עבור מספר אישי ${res.user.pn}.`, false);

      // אם המשתמש שנערך הוא בעל הסשן הנוכחי (למשל מנהל שמעדכן/מוריד את ההרשאה של עצמו) -
      // יש לרענן את הסשן מיד, אחרת ההרשאות הישנות (כולל admin) ימשיכו לחול עד יציאה ידנית.
      const me = AUTH.getSession();
      if (me && AUTH.normalizePn(me.pn) === AUTH.normalizePn(res.user.pn)) {
        AUTH.setSession(res.user);
        if (!AUTH.canManageUsers()) {
          alert('ההרשאה שלך שונתה ואינה כוללת יותר גישה למסך זה - מועבר לעמוד הראשי.');
          window.location.href = 'index.html';
          return;
        }
      }

      clearForm();
      renderUsers();
    }

    function editUser(pn) {
      const u = AUTH.findUser(pn);
      if (!u) return;
      document.getElementById('pnField').value = u.pn;
      document.getElementById('nameField').value = u.name || '';
      document.getElementById('roleField').value = u.role;
      onRoleChange();
      setCheckedUnits(u.role === 'unit' ? u.unit : []);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteUser(pn) {
      const u = AUTH.findUser(pn);
      if (!u) return;
      if (!confirm(`להסיר את ההרשאה של ${u.name || 'משתמש'} (מספר אישי ${u.pn})?`)) return;
      const res = AUTH.removeUser(pn);
      if (!res.ok) { showMsg(res.error, true); return; }

      // אם המשתמש שהוסר הוא בעל הסשן הנוכחי - הסשן נשאר מצביע על משתמש שכבר לא קיים
      // ברשימה, ולכן חובה להתנתק מיד במקום להמשיך לפעול עם הרשאות "רפאים".
      const me = AUTH.getSession();
      if (me && AUTH.normalizePn(me.pn) === AUTH.normalizePn(pn)) {
        alert('ההרשאה שלך הוסרה מהמערכת - מתנתק כעת.');
        AUTH.logout();
        return;
      }

      showMsg('המשתמש הוסר מהמערכת.', false);
      renderUsers();
    }

    function renderUsers() {
      const tbody = document.getElementById('usersBody');
      if (!tbody) return; // המסך נחסם (אין הרשאת ניהול)
      let users = AUTH.loadUsers();
      const me = AUTH.getSession();

      if (!users.length) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty-row">אין משתמשים רשומים במערכת.</td></tr>';
        return;
      }

      const searchField = document.getElementById('searchPnField');
      const query = searchField ? AUTH.normalizePn(searchField.value) : '';
      if (query) {
        users = users.filter(u => AUTH.normalizePn(u.pn).includes(query));
      }

      if (!users.length) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty-row">לא נמצאו משתמשים עם מספר אישי התואם לחיפוש.</td></tr>';
        return;
      }

      tbody.innerHTML = users.map(u => {
        const isMe = me && AUTH.normalizePn(me.pn) === AUTH.normalizePn(u.pn);
        const label = u.role === 'unit' ? AUTH.roleLabel(u) : AUTH.ROLES[u.role];
        return `
          <tr>
            <td style="font-weight:800; letter-spacing:1px;">${escapeHtml(u.pn)}${isMe ? ' <span style="color:#0284c7; font-size:11px;">(אני)</span>' : ''}</td>
            <td>${escapeHtml(u.name) || '—'}</td>
            <td><span class="role-chip role-${u.role}">${label}</span></td>
            <td>
              <button class="row-btn edit-btn" onclick="editUser('${u.pn}')">ערוך</button>
              <button class="row-btn del-btn" onclick="deleteUser('${u.pn}')">הסר</button>
            </td>
          </tr>`;
      }).join('');
    }

    if (ACCESS_GRANTED) {
      (async () => {
        try { if (typeof DataService !== 'undefined') await AUTH.refreshUsers(); } catch (e) {}
        renderUsers();
      })();
      renderUsers();
      onRoleChange();
    }
  </script>
</body>
</html>
