  <script src="config.js?v=49"></script>
  <script src="sharepointService.js?v=49"></script>
  <script src="auth.js?v=49"></script>
  <script src="script.js?v=49"></script>

  <script>
    // משתמש פלוגתי רואה בעמוד הראשי רק את כרטיסי היחידות שהוא מורשה להן (ייתכן כמה) - זהה
    // ללוגיקת canSeeUnit שכבר קיימת בסרגל הצד (renderNavbars). שאר התפקידים רואים את כל הכרטיסים.
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof AUTH === 'undefined') return;
      const session = AUTH.getSession();
      if (!session || session.role !== 'unit') return;
      const units = Array.isArray(session.unit) ? session.unit : (session.unit ? [session.unit] : []);
      document.querySelectorAll('.shortcut-card[href]').forEach(card => {
        const unitKey = AUTH.PAGE_UNIT[card.getAttribute('href')];
        if (unitKey && !units.includes(unitKey)) card.style.display = 'none';
      });
    });
  </script>
