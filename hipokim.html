  <script>
    const ALL_HIPOK_COLORS = ['bg-esuk', 'bg-hirg', 'bg-pikud', 'bg-tazam', 'bg-maphat'];

    function toggleColorMenu(btn) {
      document.querySelectorAll('.color-menu.show').forEach(menu => {
         if (menu !== btn.nextElementSibling) menu.classList.remove('show');
      });
      const menu = btn.nextElementSibling;
      menu.classList.toggle('show');
    }

    function setCellColor(btn, colorClass) {
      const wrapper = btn.closest('.cell-wrapper');
      wrapper.classList.remove(...ALL_HIPOK_COLORS);
      if (colorClass) {
        wrapper.classList.add(colorClass);
      }
      btn.closest('.color-menu').classList.remove('show');
      if (typeof saveHipokData === 'function') saveHipokData();
      if (typeof _recordUndoChange === 'function') _recordUndoChange();
      if (typeof currentWeek !== 'undefined' && typeof currentYear !== 'undefined') {
        updateHipokConflictHighlight(currentWeek, currentYear);
      }
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.color-picker-toggle') && !e.target.closest('.color-menu')) {
        document.querySelectorAll('.color-menu.show').forEach(menu => menu.classList.remove('show'));
      }
    });

    // שדה "שעה" - שני שדות שעה טבעיים (input type="time", step חצי שעה) בדיוק כמו במודאל
    // "הוספת מענה רפואי" ביחידות (esuk.html וכו') - "מ-"/"עד-" - במקום הקלדה חופשית של
    // מחרוזת (בקשת המשתמש: "כפתורים ממש להזנת שעה... בפורמט של שעה כמו בהוספת חיפוק
    // בדרישות"). שדה .time-input המקורי (מוסתר, type="hidden") נשאר מקור האמת היחיד -
    // כל התשתית הקיימת (saveHipokData/readHipokData/_loadHipokDataImpl/
    // updateHipokConflictHighlight/מנגנון הביטול-ביצוע-חוזר) ממשיכה לקרוא/לכתוב אליו בדיוק
    // כמו קודם, בלי לדעת שהערך שלו מורכב עכשיו משני שדות נפרדים.
    function _syncHipokTimeParts(wrapper) {
      const hidden = wrapper.querySelector('.time-input');
      const fromEl = wrapper.querySelector('.time-part-from');
      const toEl = wrapper.querySelector('.time-part-to');
      const from = fromEl.value;
      const to = toEl.value;
      const composed = (from && to) ? `${from} - ${to}` : '';
      if (hidden.value === composed) return;
      hidden.value = composed;
      hidden.dispatchEvent(new Event('input', { bubbles: true }));
      hidden.dispatchEvent(new Event('change', { bubbles: true }));
    }

    document.addEventListener('change', (e) => {
      if (!e.target.classList || !(e.target.classList.contains('time-part-from') || e.target.classList.contains('time-part-to'))) return;
      const wrapper = e.target.closest('.cell-wrapper');
      if (wrapper) _syncHipokTimeParts(wrapper);
    });

    document.addEventListener("DOMContentLoaded", () => {
      const cells = document.querySelectorAll("#hipoktable tbody td");

      cells.forEach(td => {
        if (td.hasAttribute("rowspan")) return;
        const oldInput = td.querySelector(".cell-input");
        if (oldInput) {
          td.innerHTML = `
            <div class="cell-wrapper">
              <div class="color-picker-toggle" onclick="toggleColorMenu(this)" title="בחר פלוגה">🎨</div>
              <div class="color-menu">
                 <div class="color-option bg-esuk" onclick="setCellColor(this, 'bg-esuk')" title="בא״ח איסו״ק (צהוב)"></div>
                 <div class="color-option bg-hirg" onclick="setCellColor(this, 'bg-hirg')" title="בא״ח חיר״ג (ירוק)"></div>
                 <div class="color-option bg-pikud" onclick="setCellColor(this, 'bg-pikud')" title="גדוד הפיקוד (כחול)"></div>
                 <div class="color-option bg-tazam" onclick="setCellColor(this, 'bg-tazam')" title="ענף תצ״מ (סגול)"></div>
                 <div class="color-option bg-maphat" onclick="setCellColor(this, 'bg-maphat')" title="מפח״ט (כתום)"></div>
                 <div class="color-option bg-clear" onclick="setCellColor(this, '')" title="נקה צבע">✕</div>
              </div>
              <textarea class="task-input" placeholder=""></textarea>
              <div class="time-range-wrap">
                <input type="time" class="time-part time-part-from" step="1800">
                <span class="time-sep">-</span>
                <input type="time" class="time-part time-part-to" step="1800">
              </div>
              <input type="hidden" class="time-input" pattern="^([01]\\d|2[0-3]):[0-5]\\d\\s-\\s([01]\\d|2[0-3]):[0-5]\\d$">
            </div>
          `;
        }
      });
    });

    // דריסת פונקציות השמירה והטעינה מ-script.js לתמיכה מלאה בצבעים
    function readHipokData() {
      const data = {};
      document.querySelectorAll('#hipoktable .task-input').forEach((el, i) => { data['task_' + i] = el.value; });
      document.querySelectorAll('#hipoktable .time-input').forEach((el, i) => { data['time_' + i] = el.value; });
      
      document.querySelectorAll('#hipoktable .cell-wrapper').forEach((el, i) => {
         const colorClass = ALL_HIPOK_COLORS.find(c => el.classList.contains(c)) || '';
         data['color_' + i] = colorClass;
      });
      return data;
    }

    // מגינה מפני שתי קריאות חופפות ל-loadHipokData בו-זמנית (למשל מחזור רענון תקופתי שמתנגש
    // עם קריאה אחרת שעוד לא הסתיימה מול שרת מרכזי אמיתי) - ראו הגנה זהה על loadTableData/
    // loadHipokData ב-script.js. הגרסה הזו (המקומית, בעמוד הזה) דורסת את זו של script.js
    // (אותו שם פונקציה גלובלית, נטענת אחריה) ולכן חייבת לכלול את אותה הגנה בעצמה.
    let _hipokPageLoadInFlight = false;
    let _hipokPageLoadRerunArgs = null;

    async function loadHipokData(week, year) {
      if (_hipokPageLoadInFlight) {
        _hipokPageLoadRerunArgs = { week, year };
        return;
      }
      _hipokPageLoadInFlight = true;
      try {
        await _loadHipokDataImpl(week, year);
      } finally {
        _hipokPageLoadInFlight = false;
        if (_hipokPageLoadRerunArgs) {
          const rerun = _hipokPageLoadRerunArgs;
          _hipokPageLoadRerunArgs = null;
          loadHipokData(rerun.week, rerun.year);
        }
      }
    }

    // ממלאת כל שדה/מחלקה ישירות לערך הסופי שלהם במעבר אחד - בלי שלב-ביניים שמרוקן הכל קודם
    // (טקסט לריק, className ל-'cell-wrapper' בלבד) ורק אחר כך ממלא מחדש. ריקון-ואז-מילוי כזה
    // גורם להבהוב אמיתי בכל מחזור רענון אוטומטי גם כשדבר לא השתנה בפועל - יש רגע קצר בלי
    // המחלקה/הצבע בכלל (אותה תבנית באג בדיוק כמו שכבר תוקנה ב-loadTableData/loadHipokData
    // הכלליים ב-script.js - ראו שם). מחשבים את מחלקת ה-CSS היעד המלאה של כל wrapper מראש,
    // ומחילים אותה (className =) רק אם היא בפועל שונה מהנוכחית.
    async function _loadHipokDataImpl(week, year) {
      const table = document.getElementById('hipoktable');
      if (!table) return;

      const key = getStorageKey('hipoktable', week, year);
      let data = null;
      if (typeof fetchTableData === 'function') {
        data = await fetchTableData(key);
      } else {
        const saved = localStorage.getItem(key);
        if (saved) data = JSON.parse(saved);
      }

      const pubKey = getStorageKey('hipoktable', week, year) + '_published';
      let published = null;
      if (typeof fetchTableData === 'function') {
        published = await fetchTableData(pubKey);
      } else {
        const saved = localStorage.getItem(pubKey);
        if (saved) published = JSON.parse(saved);
      }
      published = published || {};

      document.querySelectorAll('#hipoktable .task-input').forEach((el, i) => {
        el.value = (data && data['task_' + i] !== undefined) ? data['task_' + i] : '';
        applyRomaniotRule(el);
      });
      document.querySelectorAll('#hipoktable .time-input').forEach((el, i) => {
        const timeVal = (data && data['time_' + i] !== undefined) ? data['time_' + i] : '';
        el.value = timeVal;
        const wrapper = el.closest('.cell-wrapper');
        const fromEl = wrapper ? wrapper.querySelector('.time-part-from') : null;
        const toEl = wrapper ? wrapper.querySelector('.time-part-to') : null;
        const match = timeVal.trim().match(/^((?:[01]\d|2[0-3]):[0-5]\d)\s*-\s*((?:[01]\d|2[0-3]):[0-5]\d)$/);
        if (fromEl) fromEl.value = match ? match[1] : '';
        if (toEl) toEl.value = match ? match[2] : '';
      });

      document.querySelectorAll('#hipoktable .cell-wrapper').forEach((wrapper, i) => {
        const taskVal = data ? (data['task_' + i] || '') : '';
        const timeVal = data ? (data['time_' + i] || '') : '';
        const colorVal = data ? (data['color_' + i] || '') : '';

        const classes = ['cell-wrapper'];
        if (taskVal.trim() !== '' || timeVal.trim() !== '') classes.push('imported');
        if (colorVal) classes.push(colorVal);
        if (/רומניות/.test(taskVal)) classes.push('hipok-romaniot');

        const pubTask = published['task_' + i] || '';
        const pubTime = published['time_' + i] || '';
        const pubColor = published['color_' + i] || '';
        const changed = taskVal !== pubTask || timeVal !== pubTime || colorVal !== pubColor;
        if (changed) classes.push('conflict-overlap');

        const targetClassName = classes.join(' ');
        if (wrapper.className !== targetClassName) wrapper.className = targetClassName;
      });
    }

    /* סימון כתום (.conflict-overlap) למשבצות מענים רפואיים ששונו מאז ההפצה האחרונה של המנהל -
       מענים רפואיים לא היה מחובר למנגנון הסימון הכללי (MANAGER_TRACKED_TABLES מיועד לטבלאות מבוססות
       cell-input פשוטות), ולכן סממן "יש שינויים שלא הופצו" מעולם לא הופיע כאן. */
    async function updateHipokConflictHighlight(week, year) {
      const wrappers = document.querySelectorAll('#hipoktable .cell-wrapper');
      if (!wrappers.length) return;

      const pubKey = getStorageKey('hipoktable', week, year) + '_published';
      let published = null;
      if (typeof fetchTableData === 'function') {
        published = await fetchTableData(pubKey);
      } else {
        const saved = localStorage.getItem(pubKey);
        if (saved) published = JSON.parse(saved);
      }
      published = published || {};

      wrappers.forEach((wrapper, i) => {
        const taskVal = wrapper.querySelector('.task-input')?.value || '';
        const timeVal = wrapper.querySelector('.time-input')?.value || '';
        const colorVal = ALL_HIPOK_COLORS.find(c => wrapper.classList.contains(c)) || '';

        const pubTask = published['task_' + i] || '';
        const pubTime = published['time_' + i] || '';
        const pubColor = published['color_' + i] || '';

        const changed = taskVal !== pubTask || timeVal !== pubTime || colorVal !== pubColor;
        wrapper.classList.toggle('conflict-overlap', changed);
      });
    }

    /* חוקי עסק לטבלת המענים הרפואיים (אפיון 1.7) */

    // צביעה אדומה אוטומטית כאשר התיאור מכיל את המילה "רומניות"
    function applyRomaniotRule(taskEl) {
      if (!taskEl) return;
      const wrapper = taskEl.closest('.cell-wrapper');
      if (!wrapper) return;
      if (/רומניות/.test(taskEl.value || '')) {
        wrapper.classList.add('hipok-romaniot');
      } else {
        wrapper.classList.remove('hipok-romaniot');
      }
    }

    // שדה "שעה" מקבל ספרות, נקודתיים, רווח ומקף בלבד (פורמט HH:MM - HH:MM)
    function sanitizeTimeInput(el) {
      if (!el) return;
      const cleaned = (el.value || '').replace(/[^0-9:\-\s]/g, '');
      if (cleaned !== el.value) el.value = cleaned;
    }

    // תבנית "HH:MM - HH:MM" תקינה (זהה לוולידציה במודאל "הוספת מענה רפואי" ביחידות) -
    // ה-pattern שהיה על ה-input לא נאכף בפועל כי השדה אינו בתוך <form>, ולכן עד כה
    // ניתן היה להזין ערך שאינו בפורמט שעה תקין ישירות לתוך הטבלה.
    const HIPOK_TIME_PATTERN = /^([01]\d|2[0-3]):[0-5]\d\s*-\s*([01]\d|2[0-3]):[0-5]\d$/;

    function validateTimeInputFormat(el) {
      if (!el) return;
      const val = (el.value || '').trim();
      const isInvalid = val !== '' && !HIPOK_TIME_PATTERN.test(val);
      el.classList.toggle('time-input-invalid', isInvalid);
      el.title = isInvalid ? 'פורמט שעה לא תקין - יש להזין לדוגמה: 12:00 - 12:30' : '';
    }

    document.addEventListener('input', (e) => {
      if (!e.target) return;
      if (e.target.classList.contains('task-input')) {
        applyRomaniotRule(e.target);
      } else if (e.target.classList.contains('time-input')) {
        sanitizeTimeInput(e.target);
      } else {
        return;
      }
      if (typeof currentWeek !== 'undefined' && typeof currentYear !== 'undefined') {
        updateHipokConflictHighlight(currentWeek, currentYear);
      }
    });

    document.addEventListener('blur', (e) => {
      if (e.target && e.target.classList && e.target.classList.contains('time-input')) {
        validateTimeInputFormat(e.target);
      }
    }, true);
  </script>
